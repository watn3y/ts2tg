<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting to TeamSpeak</title>
    <link rel="icon" type="image/svg+xml" href="teamspeak.svg" />
    <style>
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("inter-latin-ext.woff2") format("woff2");
            unicode-range:
                U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
                U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
                U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("inter-latin.woff2") format("woff2");
            unicode-range:
                U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
                U+2212, U+2215, U+FEFF, U+FFFD;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Inter",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background-color: #0d0e12;
            color: #e2e4eb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #16181f;
            border: 1px solid #1e2029;
            border-radius: 12px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f0f1f5;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.85rem;
            color: #6b6f82;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            padding: 11px 12px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition:
                background 0.15s,
                border-color 0.15s,
                color 0.15s,
                transform 0.1s;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #2f54eb;
            color: #fff;
            border: 1px solid #2f54eb;
        }

        .btn-primary:hover {
            background: #3d63f5;
            border-color: #3d63f5;
        }

        .btn-secondary {
            background: transparent;
            color: #9295a8;
            border: 1px solid #23252e;
        }

        .btn-secondary:hover {
            background: #1d1f27;
            color: #e2e4eb;
            border-color: #2e3040;
        }

        @media (max-width: 360px) {
            .btn-group {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 28px 18px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="logo" src="teamspeak.svg" alt="TeamSpeak" />
        <h1>Connecting to TeamSpeak</h1>
        <p>
            Launching your client automatically. If nothing opens, choose your
            version below.
        </p>

        <div class="btn-group">
            <a id="btn-ts6" class="btn btn-primary">TeamSpeak 6</a>
            <a id="btn-ts3" class="btn btn-secondary">TeamSpeak 3</a>
        </div>

        <div class="btn-group">
            <a id="btn-ios" class="btn btn-secondary">TeamSpeak iOS</a>
            <a id="btn-android" class="btn btn-secondary">TeamSpeak Android</a>
        </div>
    </div>

    <script type="text/javascript">
        //CHANGE ME
        var SERVER = "example.com";

        document.getElementById("btn-ts6").href = "teamspeak://" + SERVER;
        document.getElementById("btn-ts3").href = "ts3server://" + SERVER;
        document.getElementById("btn-ios").href = "ts3server://" + SERVER;
        document.getElementById("btn-android").href = "ts3server://" + SERVER;

        // 1. Attempt to launch TeamSpeak 6
        var iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = "teamspeak://" + SERVER;
        document.body.appendChild(iframe);

        // 2. Attempt to launch TeamSpeak 3 as a fallback
        setTimeout(function () {
            window.location.href = "ts3server://" + SERVER;
        }, 500);
    </script>
</body>

</html>
